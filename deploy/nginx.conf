server {
    listen 80;
    server_name quzen.online www.quzen.online;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-term caching for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.svg {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Single-page app: always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Camera/mic are same-origin only until a real signaling backend exists
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
}
