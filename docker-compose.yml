services:
  server:
    build: ./server
    image: quzen-rooms-server:latest
    container_name: quzen-rooms-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set a real secret in .env}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      DYNAMO_USERS_TABLE: ${DYNAMO_USERS_TABLE:?set DynamoDB table names in .env}
      DYNAMO_ROOMS_TABLE: ${DYNAMO_ROOMS_TABLE:?set DynamoDB table names in .env}
      DYNAMO_PARTICIPANTS_TABLE: ${DYNAMO_PARTICIPANTS_TABLE:?set DynamoDB table names in .env}
      DYNAMO_MESSAGES_TABLE: ${DYNAMO_MESSAGES_TABLE:?set DynamoDB table names in .env}
      DYNAMO_REFRESH_TOKENS_TABLE: ${DYNAMO_REFRESH_TOKENS_TABLE:?set DynamoDB table names in .env}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN_DAYS: 30
      COOKIE_DOMAIN: localhost
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"

  quzen-rooms:
    build: .
    image: quzen-rooms-frontend:latest
    container_name: quzen-rooms-frontend
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"

