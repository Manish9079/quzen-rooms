version: 1

backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - PARCEL_VERSION=$(node -p "require('./node_modules/@parcel/watcher/package.json').version")
        - npm install --no-save "@parcel/watcher-linux-x64-glibc@$PARCEL_VERSION"

    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - ROLLDOWN_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")
        - LIGHTNINGCSS_VERSION=$(node -p "require('./node_modules/lightningcss/package.json').version")
        - npm install --no-save "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION" "lightningcss-linux-x64-gnu@$LIGHTNINGCSS_VERSION"

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*