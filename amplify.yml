version: 1

backend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npm install @parcel/watcher-linux-x64-glibc@2.6.0 --no-save
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID

frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      - .npm/**/*