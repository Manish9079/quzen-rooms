name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native bindings
        shell: bash
        run: |
          OXLINT_VERSION=$(node -p "require('./node_modules/oxlint/package.json').version")
          ROLLDOWN_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")

          npm install --no-save \
            "@oxlint/binding-linux-x64-gnu@$OXLINT_VERSION" \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION"

      - name: Run lint
        run: npm run lint

  backend-image:
    name: Backend - Build & Push Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/quzen-rooms-api:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/quzen-rooms-api:latest

     


