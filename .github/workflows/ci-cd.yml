name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux native bindings
        shell: bash
        run: |
          OXLINT_VERSION=$(node -p "require('./node_modules/oxlint/package.json').version")
          ROLLDOWN_VERSION=$(node -p "require('./node_modules/rolldown/package.json').version")

          npm install --no-save \
            "@oxlint/binding-linux-x64-gnu@$OXLINT_VERSION" \
            "@rolldown/binding-linux-x64-gnu@$ROLLDOWN_VERSION"

      - name: Run lint
        run: npm run lint

     

     
